[project]
name = "dewey.decimal"
version = "1.0.0"
description = "Decision-ready text statistics from one written spec with identical Python, JavaScript and Go implementations. Counts, top terms, sentiment, readability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "SIM102"]

[tool.mypy]
files = ["dewey_decimal"]
disallow_untyped_defs = false
ignore_missing_imports = true
